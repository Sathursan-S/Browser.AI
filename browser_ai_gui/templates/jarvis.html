<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Browser.AI Voice Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0a192f;
            --accent-color: #64ffda;
            --text-primary: #ccd6f6;
            --text-secondary: #8892b0;
            --background: #0a192f;
            --surface: #112240;
            --surface-light: #1d3557;
            --jarvis-glow: rgba(0, 212, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #0d1f3c 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            margin-bottom: 20px;
        }

        .jarvis-title {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--jarvis-glow);
            margin-bottom: 10px;
        }

        .jarvis-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        /* Language Selector */
        .language-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .language-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .language-btn:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .language-btn.active {
            background: var(--primary-color);
            color: var(--background);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Conversation Area */
        .conversation-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(17, 34, 64, 0.5);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 15px;
            line-height: 1.6;
        }

        .message.assistant .message-content {
            background: var(--surface);
            border-left: 3px solid var(--primary-color);
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: rgba(0, 212, 255, 0.1);
            border-right: 3px solid var(--accent-color);
            color: var(--text-primary);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin: 0 10px;
        }

        .assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), #00a8cc);
            order: -1;
        }

        .user .message-avatar {
            background: linear-gradient(135deg, var(--accent-color), #20e3b2);
            order: 1;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 5px;
            text-align: right;
        }

        .message.user .message-time {
            text-align: left;
        }

        /* Voice Interface */
        .voice-interface {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        /* Jarvis Orb */
        .jarvis-orb-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }

        .jarvis-orb {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--primary-color), transparent 70%),
                        radial-gradient(circle at 70% 70%, var(--accent-color), transparent 60%),
                        linear-gradient(135deg, var(--surface), var(--surface-light));
            box-shadow: 0 0 30px var(--jarvis-glow),
                        0 0 60px var(--jarvis-glow),
                        inset 0 0 30px rgba(0, 212, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jarvis-orb:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--jarvis-glow),
                        0 0 80px var(--jarvis-glow),
                        inset 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .jarvis-orb.listening {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .jarvis-orb.speaking {
            animation: speak 0.5s ease-in-out infinite;
        }

        .jarvis-orb.processing {
            animation: rotate 2s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 30px var(--jarvis-glow),
                            0 0 60px var(--jarvis-glow);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 50px rgba(0, 212, 255, 0.5),
                            0 0 100px rgba(0, 212, 255, 0.3);
            }
        }

        @keyframes speak {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .orb-icon {
            font-size: 50px;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
        }

        .orb-rings {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            animation: ring-pulse 3s ease-in-out infinite;
        }

        .orb-rings::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 50%;
            animation: ring-pulse 3s ease-in-out infinite 0.5s;
        }

        @keyframes ring-pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        /* Voice Status */
        .voice-status {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .voice-status.active {
            color: var(--accent-color);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status-indicator.active {
            background: var(--accent-color);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Text Input Alternative */
        .text-input-container {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .text-input {
            flex: 1;
            padding: 12px 20px;
            background: var(--surface-light);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 25px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--jarvis-glow);
        }

        .text-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary-color), #00a8cc);
            border: none;
            border-radius: 25px;
            color: var(--background);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--jarvis-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Task Ready Indicator */
        .task-ready {
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .task-ready h3 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .task-description {
            color: var(--text-primary);
            margin-bottom: 15px;
            font-style: italic;
        }

        .task-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .execute-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent-color), #20e3b2);
            border: none;
            border-radius: 25px;
            color: var(--background);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .execute-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
        }

        .cancel-btn {
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--text-secondary);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cancel-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Settings Panel */
        .settings-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            color: var(--text-secondary);
        }

        .settings-toggle:hover {
            background: var(--surface-light);
            color: var(--primary-color);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid rgba(100, 255, 218, 0.1);
            padding: 20px;
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .settings-header h2 {
            color: var(--primary-color);
            font-weight: 400;
        }

        .close-settings {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .settings-group {
            margin-bottom: 25px;
        }

        .settings-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .settings-group select,
        .settings-group input {
            width: 100%;
            padding: 10px 15px;
            background: var(--surface-light);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .settings-group select:focus,
        .settings-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .jarvis-title {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }

            .jarvis-orb-container {
                width: 120px;
                height: 120px;
            }

            .message-content {
                max-width: 85%;
            }

            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Instructions */
        .instructions {
            text-align: center;
            padding: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .instructions kbd {
            background: var(--surface-light);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="jarvis-title">J.A.R.V.I.S</h1>
            <p class="jarvis-subtitle">Just A Rather Very Intelligent System • Browser.AI Voice Assistant</p>
            
            <!-- Language Selector -->
            <div class="language-selector">
                <button class="language-btn active" data-lang="en">English</button>
                <button class="language-btn" data-lang="ta">தமிழ்</button>
                <button class="language-btn" data-lang="si">සිංහල</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Conversation Area -->
            <div class="conversation-area" id="conversationArea">
                <!-- Messages will be added here -->
            </div>

            <!-- Voice Interface -->
            <div class="voice-interface">
                <!-- JARVIS Orb -->
                <div class="jarvis-orb-container">
                    <div class="orb-rings"></div>
                    <div class="jarvis-orb" id="jarvisOrb" onclick="toggleVoice()">
                        <span class="orb-icon" id="orbIcon">🎤</span>
                    </div>
                </div>

                <!-- Voice Status -->
                <div class="voice-status" id="voiceStatus">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">Click orb or press Space to speak</span>
                </div>

                <!-- Text Input Alternative -->
                <div class="text-input-container">
                    <input type="text" class="text-input" id="textInput" placeholder="Or type your request here..." />
                    <button class="send-btn" id="sendBtn" onclick="sendTextMessage()">Send</button>
                </div>

                <!-- Task Ready Panel (hidden by default) -->
                <div class="task-ready" id="taskReady" style="display: none;">
                    <h3>✅ Task Ready</h3>
                    <p class="task-description" id="taskDescription"></p>
                    <div class="task-actions">
                        <button class="execute-btn" onclick="executeTask()">Execute Task</button>
                        <button class="cancel-btn" onclick="cancelTask()">Cancel</button>
                    </div>
                </div>

                <p class="instructions">
                    Press <kbd>Space</kbd> to speak • <kbd>Enter</kbd> to send text • <kbd>Esc</kbd> to cancel
                </p>
            </div>
        </main>
    </div>

    <!-- Settings Toggle -->
    <button class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">⚙️</button>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-settings" onclick="toggleSettings()">×</button>
        </div>

        <div class="settings-group">
            <label>LLM Provider</label>
            <select id="llmProvider">
                <option value="google">Google (Gemini)</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
                <option value="ollama">Ollama (Local)</option>
            </select>
        </div>

        <div class="settings-group">
            <label>API Key</label>
            <input type="password" id="apiKey" placeholder="Enter API key..." />
        </div>

        <div class="settings-group">
            <label>Speech Recognition Language</label>
            <select id="speechLang">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="ta-IN">Tamil (India)</option>
                <option value="ta-LK">Tamil (Sri Lanka)</option>
                <option value="si-LK">Sinhala</option>
            </select>
        </div>

        <div class="settings-group">
            <label>
                <input type="checkbox" id="autoSpeak" checked /> Enable Text-to-Speech
            </label>
        </div>

        <div class="settings-group">
            <label>TTS Voice</label>
            <select id="ttsVoice">
                <!-- Populated dynamically -->
            </select>
        </div>
    </div>

    <script>
        // Initialize Socket.IO
        const socket = io();
        
        // State
        let sessionId = null;
        let currentLanguage = 'en';
        let isRecording = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let currentTaskPlan = null;
        let voices = [];

        // Elements
        const conversationArea = document.getElementById('conversationArea');
        const jarvisOrb = document.getElementById('jarvisOrb');
        const orbIcon = document.getElementById('orbIcon');
        const voiceStatus = document.getElementById('voiceStatus');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const taskReady = document.getElementById('taskReady');
        const taskDescription = document.getElementById('taskDescription');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeSession();
            initializeSpeechRecognition();
            initializeTTS();
            setupEventListeners();
        });

        // Initialize conversation session
        async function initializeSession() {
            try {
                const response = await fetch('/api/jarvis/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: currentLanguage })
                });
                const data = await response.json();
                
                if (data.success) {
                    sessionId = data.session_id;
                    // Start conversation
                    startConversation();
                }
            } catch (error) {
                console.error('Failed to initialize session:', error);
                addMessage('assistant', 'Connection error. Please refresh the page.');
            }
        }

        // Start conversation with greeting
        async function startConversation() {
            try {
                const response = await fetch(`/api/jarvis/start/${sessionId}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success && data.message) {
                    addMessage('assistant', data.message.content);
                    if (document.getElementById('autoSpeak').checked) {
                        speak(data.message.content);
                    }
                }
            } catch (error) {
                console.error('Failed to start conversation:', error);
            }
        }

        // Initialize Speech Recognition
        function initializeSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                statusText.textContent = 'Voice not supported - use text input';
                jarvisOrb.style.opacity = '0.5';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = document.getElementById('speechLang').value;

            recognition.onstart = () => {
                isRecording = true;
                jarvisOrb.classList.add('listening');
                orbIcon.textContent = '🔴';
                statusIndicator.classList.add('active');
                statusText.textContent = 'Listening... Speak now';
                voiceStatus.classList.add('active');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        // Final result - send message
                        stopRecording();
                        sendVoiceMessage(transcript);
                    }
                }
                statusText.textContent = transcript || 'Listening...';
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopRecording();
                
                let errorMsg = 'Voice error';
                if (event.error === 'no-speech') {
                    errorMsg = 'No speech detected. Try again.';
                } else if (event.error === 'not-allowed') {
                    errorMsg = 'Microphone access denied';
                }
                statusText.textContent = errorMsg;
            };

            recognition.onend = () => {
                if (isRecording) {
                    stopRecording();
                }
            };
        }

        // Initialize Text-to-Speech
        function initializeTTS() {
            // Load voices
            function loadVoices() {
                voices = synthesis.getVoices();
                const voiceSelect = document.getElementById('ttsVoice');
                voiceSelect.innerHTML = '';
                
                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                });
            }

            if (synthesis.onvoiceschanged !== undefined) {
                synthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();
        }

        // Toggle voice recording
        function toggleVoice() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        // Start recording
        function startRecording() {
            if (!recognition) {
                statusText.textContent = 'Voice not available';
                return;
            }
            
            // Check microphone permission
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    stream.getTracks().forEach(track => track.stop());
                    recognition.lang = document.getElementById('speechLang').value;
                    recognition.start();
                })
                .catch(error => {
                    console.error('Microphone error:', error);
                    statusText.textContent = 'Microphone access denied';
                });
        }

        // Stop recording
        function stopRecording() {
            isRecording = false;
            jarvisOrb.classList.remove('listening');
            orbIcon.textContent = '🎤';
            statusIndicator.classList.remove('active');
            voiceStatus.classList.remove('active');
            statusText.textContent = 'Click orb or press Space to speak';
            
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {}
            }
        }

        // Send voice message
        async function sendVoiceMessage(transcript) {
            if (!transcript.trim()) return;
            
            addMessage('user', transcript);
            await processMessage(transcript);
        }

        // Send text message
        async function sendTextMessage() {
            const text = textInput.value.trim();
            if (!text) return;
            
            textInput.value = '';
            addMessage('user', text);
            await processMessage(text);
        }

        // Process message
        async function processMessage(message) {
            // Show processing state
            jarvisOrb.classList.add('processing');
            statusText.textContent = 'Processing...';
            
            // Add typing indicator
            const typingId = addTypingIndicator();

            try {
                const response = await fetch('/api/jarvis/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message,
                        language: currentLanguage
                    })
                });
                const data = await response.json();
                
                // Remove typing indicator
                removeTypingIndicator(typingId);
                
                if (data.success) {
                    // Add assistant response
                    addMessage('assistant', data.response.content);
                    
                    // Speak response if enabled
                    if (document.getElementById('autoSpeak').checked) {
                        speak(data.response.content);
                    }
                    
                    // Check if task is ready
                    if (data.task_plan && data.task_plan.is_ready) {
                        showTaskReady(data.task_plan);
                    }
                } else {
                    addMessage('assistant', data.error || 'Sorry, I encountered an error.');
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                console.error('Error processing message:', error);
                addMessage('assistant', 'Connection error. Please try again.');
            } finally {
                jarvisOrb.classList.remove('processing');
                statusText.textContent = 'Click orb or press Space to speak';
            }
        }

        // Add message to conversation
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const avatar = role === 'assistant' ? '🤖' : '👤';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    ${formatMessage(content)}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            conversationArea.appendChild(messageDiv);
            conversationArea.scrollTop = conversationArea.scrollHeight;
        }

        // Format message content
        function formatMessage(content) {
            // Convert newlines to <br>
            content = content.replace(/\n/g, '<br>');
            // Highlight task ready indicator
            content = content.replace(/✅ READY TO EXECUTE/g, '<strong style="color: var(--accent-color);">✅ READY TO EXECUTE</strong>');
            return content;
        }

        // Add typing indicator
        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = id;
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            conversationArea.appendChild(typingDiv);
            conversationArea.scrollTop = conversationArea.scrollHeight;
            return id;
        }

        // Remove typing indicator
        function removeTypingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        // Text-to-Speech
        function speak(text) {
            // Cancel any ongoing speech
            synthesis.cancel();
            
            // Clean text for speech
            let cleanText = text
                .replace(/✅ READY TO EXECUTE/g, 'Ready to execute')
                .replace(/TASK:/g, 'Task:')
                .replace(/<[^>]*>/g, '');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            // Set voice
            const voiceIndex = document.getElementById('ttsVoice').value;
            if (voices[voiceIndex]) {
                utterance.voice = voices[voiceIndex];
            }
            
            // Set language based on current language
            const langMap = {
                'en': 'en-US',
                'ta': 'ta-IN',
                'si': 'si-LK'
            };
            utterance.lang = langMap[currentLanguage] || 'en-US';
            
            // Speaking animation
            utterance.onstart = () => {
                jarvisOrb.classList.add('speaking');
            };
            
            utterance.onend = () => {
                jarvisOrb.classList.remove('speaking');
            };
            
            synthesis.speak(utterance);
        }

        // Show task ready panel
        function showTaskReady(taskPlan) {
            currentTaskPlan = taskPlan;
            taskDescription.textContent = taskPlan.description;
            taskReady.style.display = 'block';
        }

        // Execute task
        async function executeTask() {
            if (!currentTaskPlan) return;
            
            try {
                const response = await fetch('/api/jarvis/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        task: currentTaskPlan.description
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    taskReady.style.display = 'none';
                    addMessage('assistant', '🚀 Executing task: ' + currentTaskPlan.description);
                    
                    // Redirect to main interface for task execution
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    }
                } else {
                    addMessage('assistant', '❌ Failed to start task: ' + data.error);
                }
            } catch (error) {
                console.error('Error executing task:', error);
                addMessage('assistant', '❌ Connection error while starting task.');
            }
        }

        // Cancel task
        function cancelTask() {
            currentTaskPlan = null;
            taskReady.style.display = 'none';
            addMessage('assistant', 'Task cancelled. How else may I assist you?');
        }

        // Language selection
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('.language-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLanguage = btn.dataset.lang;
                
                // Update session language
                try {
                    await fetch('/api/jarvis/language', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: sessionId,
                            language: currentLanguage
                        })
                    });
                    
                    // Update speech recognition language
                    const langMap = {
                        'en': 'en-US',
                        'ta': 'ta-IN',
                        'si': 'si-LK'
                    };
                    document.getElementById('speechLang').value = langMap[currentLanguage] || 'en-US';
                    
                } catch (error) {
                    console.error('Error updating language:', error);
                }
            });
        });

        // Settings panel toggle
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        // Setup event listeners
        function setupEventListeners() {
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Space to toggle voice (when not in input)
                if (e.code === 'Space' && document.activeElement !== textInput) {
                    e.preventDefault();
                    toggleVoice();
                }
                
                // Enter to send text
                if (e.code === 'Enter' && document.activeElement === textInput) {
                    e.preventDefault();
                    sendTextMessage();
                }
                
                // Escape to cancel recording
                if (e.code === 'Escape' && isRecording) {
                    stopRecording();
                }
            });
            
            // Speech language change
            document.getElementById('speechLang').addEventListener('change', (e) => {
                if (recognition) {
                    recognition.lang = e.target.value;
                }
            });
        }

        // Socket events for real-time updates
        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('jarvis_response', (data) => {
            if (data.session_id === sessionId) {
                addMessage('assistant', data.message);
                if (document.getElementById('autoSpeak').checked) {
                    speak(data.message);
                }
            }
        });

        socket.on('task_update', (data) => {
            if (data.session_id === sessionId) {
                addMessage('assistant', '📊 ' + data.status);
            }
        });
    </script>
</body>
</html>
